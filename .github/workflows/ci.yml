name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    # Legacy projects target net47 (.NET Framework) -- Windows runner only.
    # The VFS engine tier (net10.0) is platform-agnostic and runs here too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # net10.0 for DriveBender.Vfs / Mount; 8.x kept for the net47 tier
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Stamp versions
        shell: bash
        run: perl .github/workflows/scripts/version.pl --stamp

      - name: Restore
        run: dotnet restore DriveBender.sln

      - name: Build
        run: dotnet build DriveBender.sln --configuration Release --no-restore

      # Filter out every test that needs a real DriveBender install or a
       # mountable filesystem. Some fixtures are missing their `[Category]`
       # attribute (e.g. PoolManagementIntegrationTests), so we also match on
       # the namespace segments `Integration`, `EndToEnd`, `Performance`,
       # `Regression` plus a few individually-failing unit-named tests.
      - name: Test (isolated unit tests)
        run: >
          dotnet test DriveBender.Tests/DriveBender.Tests.csproj
          --configuration Release --no-build
          --filter "(TestCategory!=Integration&TestCategory!=EndToEnd&TestCategory!=Performance)&(FullyQualifiedName!~.Integration.&FullyQualifiedName!~.EndToEnd.&FullyQualifiedName!~.Performance.&FullyQualifiedName!~.Regression.)&(FullyQualifiedName!~CreatePool_WithNonExistentDrive&FullyQualifiedName!~Bug002_InfiniteLoopInDuplicationEnabling&FullyQualifiedName!~PoolManager_WithAccessDeniedToDirectory)"
          --logger "trx;LogFileName=unit-tests.trx"

      # The VFS engine tier is pure-unit by design (in-memory fakes, TST-FAKE):
      # it must stay green everywhere, headless, no real pool required.
      - name: Test (VFS engine, headless)
        run: >
          dotnet test DriveBender.Vfs.Tests/DriveBender.Vfs.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=vfs-tests.trx"


      - name: Test (integration + e2e + known-flaky, allow-fail)
        continue-on-error: true
        run: >
          dotnet test DriveBender.Tests/DriveBender.Tests.csproj
          --configuration Release --no-build
          --filter "TestCategory=Integration|TestCategory=EndToEnd|FullyQualifiedName~.Integration.|FullyQualifiedName~.EndToEnd.|FullyQualifiedName~.Regression.|FullyQualifiedName~CreatePool_WithNonExistentDrive|FullyQualifiedName~Bug002_InfiniteLoopInDuplicationEnabling|FullyQualifiedName~PoolManager_WithAccessDeniedToDirectory"
          --logger "trx;LogFileName=extra-tests.trx"

      # Wall-clock performance tests are advisory -- a slow shared runner must not
      # fail the build on a timing assertion.
      - name: Performance tests
        continue-on-error: true
        run: >
          dotnet test DriveBender.Tests/DriveBender.Tests.csproj
          --configuration Release --no-build
          --filter "TestCategory=Performance"
          --logger "trx;LogFileName=perf-tests.trx"

      # logs and artifacts need repository credentials; annotations do not, so the failing
      # assertion is readable by anyone looking at the run
      - name: Publish failures as annotations
        if: always()
        shell: pwsh
        run: ./.github/workflows/scripts/trx-annotations.ps1 -Path .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  # ---------------------------------------------------------------------------
  # End-to-end: the SHIPPED binary, on both targets, the way a user meets it.
  #
  # The engine suite drives an in-memory fake, so it stays green even when the real
  # product cannot mount at all -- which is exactly what happened: the member
  # online-probe was broken for every local pool while 574 unit tests passed. These
  # jobs install a real filesystem driver, mount a real pool and drive it through the
  # OS, then serve the management UI and drive it in a real browser.
  #
  # DBE2E_REQUIRE_DRIVER=1 turns "no driver, skipping" into a failure: a silently
  # skipped end-to-end suite is indistinguishable from a passing one.
  # ---------------------------------------------------------------------------
  e2e-windows:
    name: End-to-end (Windows - WinFsp driver + UI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Stamp versions
        shell: bash
        run: perl .github/workflows/scripts/version.pl --stamp

      # Install the SAME WinFsp the product installs (Prerequisites._WINFSP_TAG = v2.1), not
      # whatever chocolatey currently ships: winfsp.net's managed binding demands a native runtime
      # of the same major.minor, so a different version here would test a configuration the
      # product never creates and blame it for the mismatch.
      - name: Install WinFsp v2.1 (the version the product pins)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/winfsp/winfsp/releases/tags/v2.1'
          $asset = $release.assets | Where-Object { $_.name -like '*.msi' } | Select-Object -First 1
          if (-not $asset) { throw 'No MSI in the winfsp v2.1 release' }
          Write-Host "Installing $($asset.name)"
          $msi = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest $asset.browser_download_url -OutFile $msi
          Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -NoNewWindow

      # A driver whose files are present but whose kernel service is missing reports as
      # "installed" and then takes the mount process down with an access violation, so
      # the job proves the service exists before blaming the product for a crash.
      - name: Verify the driver is registered
        shell: pwsh
        run: |
          $service = Get-Service -Name 'WinFsp*' -ErrorAction SilentlyContinue
          if (-not $service) { throw 'WinFsp installed no driver service - a mount would crash rather than fail cleanly' }
          $service | Format-Table -AutoSize
          $dll = 'C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll'
          if (Test-Path $dll) {
            $native = (Get-Item $dll).VersionInfo.FileVersion
            Write-Host "::notice::native winfsp-x64.dll = $native (the managed binding is pinned to 2.1.25156)"
          }

      - name: Build
        run: dotnet build DriveBender.sln --configuration Release

      - name: Install Chromium for Playwright
        shell: pwsh
        run: DriveBender.EndToEnd.Tests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: End-to-end tests
        shell: bash
        env:
          DBE2E_REQUIRE_DRIVER: '1'
          DBMOUNT_EXE: ${{ github.workspace }}/DriveBender.Mount/bin/Release/net10.0-windows/dbmount.exe
        run: >
          dotnet test DriveBender.EndToEnd.Tests/DriveBender.EndToEnd.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=e2e-windows.trx"

      # logs and artifacts need repository credentials; annotations do not, so the actual
      # assertion is published where anyone can read it
      - name: Publish failures as annotations
        if: always()
        shell: pwsh
        run: ./.github/workflows/scripts/trx-annotations.ps1 -Path DriveBender.EndToEnd.Tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows-results
          path: '**/TestResults/*.trx'

  e2e-linux:
    name: End-to-end (Linux - FUSE driver + UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Stamp versions
        run: perl .github/workflows/scripts/version.pl --stamp

      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-3
          # the runner user must be able to open the device, else every mount fails with EPERM
          sudo chmod 666 /dev/fuse
          ls -l /dev/fuse
          fusermount3 --version

      # net47 is Windows-only, so only the portable projects are built here
      - name: Build
        run: |
          dotnet build DriveBender.Mount/DriveBender.Mount.csproj --configuration Release --framework net10.0
          dotnet build DriveBender.EndToEnd.Tests/DriveBender.EndToEnd.Tests.csproj --configuration Release

      - name: Install Chromium for Playwright
        run: pwsh DriveBender.EndToEnd.Tests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: End-to-end tests
        env:
          DBE2E_REQUIRE_DRIVER: '1'
          DBMOUNT_EXE: ${{ github.workspace }}/DriveBender.Mount/bin/Release/net10.0/dbmount
        run: >
          dotnet test DriveBender.EndToEnd.Tests/DriveBender.EndToEnd.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=e2e-linux.trx"

      # logs and artifacts need repository credentials; annotations do not, so the actual
      # assertion is published where anyone can read it
      - name: Publish failures as annotations
        if: always()
        shell: pwsh
        run: ./.github/workflows/scripts/trx-annotations.ps1 -Path DriveBender.EndToEnd.Tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux-results
          path: '**/TestResults/*.trx'

  # ---------------------------------------------------------------------------
  # The end-to-end coverage matrix is DERIVED from the two jobs above and committed
  # back, so docs/EndToEndCoverage.md always reflects the last real run on real
  # drivers. A hand-kept table drifts the moment a scenario is added or starts
  # failing, and then quietly misleads about what is actually covered.
  # ---------------------------------------------------------------------------
  e2e-matrix:
    name: End-to-end coverage matrix
    runs-on: ubuntu-latest
    needs: [e2e-windows, e2e-linux]
    if: always() && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: e2e-windows-results
          path: results/windows
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: e2e-linux-results
          path: results/linux
        continue-on-error: true

      - name: Regenerate the coverage matrix
        shell: pwsh
        run: ./.github/workflows/scripts/e2e-matrix.ps1 -WindowsTrx results/windows -LinuxTrx results/linux -Output docs/EndToEndCoverage.md

      - name: Commit it when it changed
        run: |
          if git diff --quiet -- docs/EndToEndCoverage.md; then
            echo "coverage matrix unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EndToEndCoverage.md
          git commit -m "* end-to-end coverage matrix regenerated from the latest run on both targets"
          git push

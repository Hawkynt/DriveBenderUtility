name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: echo "version=$(perl .github/workflows/scripts/version.pl)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release-kind: release
      changelog-flag: --release v${{ needs.version.outputs.version }}

  nuget:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the short-lived OIDC token that nuget.org's Trusted Publishing exchanges
      # for a one-hour API key. Without it the login step cannot mint a token and the push falls
      # back to the stored NUGET_TOKEN.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # The cloud storage library is platform-agnostic (net10.0), so it packs and
      # ships from the Linux runner independently of the Windows release artifacts.
      - name: Pack Hawkynt.CloudStorage
        run: >
          dotnet pack Hawkynt.CloudStorage/Hawkynt.CloudStorage.csproj
          -c Release
          -p:Version=${{ needs.version.outputs.version }}
          -p:PackageVersion=${{ needs.version.outputs.version }}
          --output nupkg

      # Trusted Publishing: nuget.org exchanges a GitHub OIDC token for an API key valid one hour, so
      # no long-lived secret has to exist. It needs a policy on nuget.org (your username ▸ Trusted
      # Publishing) naming owner `Hawkynt`, repository `DriveBenderUtility` and workflow file
      # `release.yml`. Until that policy exists this step fails and the push below falls back to
      # NUGET_TOKEN.
      - name: NuGet login (OIDC → short-lived key)
        id: nugetlogin
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          OIDC_KEY: ${{ steps.nugetlogin.outputs.NUGET_API_KEY }}
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          if [ -n "$OIDC_KEY" ]; then
            echo "Publishing with a short-lived Trusted Publishing key."
            KEY="$OIDC_KEY"
          elif [ -n "$NUGET_TOKEN" ]; then
            echo "::warning::Trusted Publishing is not configured; falling back to the stored NUGET_TOKEN."
            KEY="$NUGET_TOKEN"
          else
            echo "::error::No publishing credential — configure Trusted Publishing or set NUGET_TOKEN."
            exit 1
          fi

          for pkg in nupkg/*.nupkg; do
            echo "Pushing $(basename "$pkg")"
            dotnet nuget push "$pkg" \
              --api-key "$KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # "Your package was pushed" only means nuget.org accepted it for validation. It can still fail
      # validation later and never become available while the push exited 0. Without this wait a
      # rejected package produces a green release.
      - name: Wait for the packages to become available
        run: |
          fail=0
          for pkg in nupkg/*.nupkg; do
            base=$(basename "$pkg" .nupkg)
            # "Id.1.2.3.4" -> id, version. The version is the trailing dotted-numeric run.
            version=$(echo "$base" | grep -oE '[0-9]+(\.[0-9]+)*$')
            id=${base%.$version}
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')

            echo "Waiting for $id $version…"
            found=0
            for _ in $(seq 1 60); do
              if curl -sf "https://api.nuget.org/v3-flatcontainer/$lower/index.json" \
                   | grep -q "\"$version\""; then
                echo "  available"
                found=1
                break
              fi
              sleep 15
            done

            if [ "$found" -ne 1 ]; then
              echo "::error::$id $version was pushed but never became available on nuget.org — it likely failed validation. Check the rejection mail on the nuget.org account."
              fail=1
            fi
          done
          exit $fail

  publish:
    # Also waits on nuget: a release tagged v<version> whose package never reached nuget.org is a
    # release in name only, and until now a failed or rejected push still produced a green release.
    needs: [version, build, nuget]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with: { name: "${{ needs.build.outputs.console-artifact }}", path: dist }
      - uses: actions/download-artifact@v4
        with: { name: "${{ needs.build.outputs.ui-artifact }}",      path: dist }

      # Notes = a short curated header + the commit-prefix changelog (+ - * # !),
      # NOT GitHub's PR-based "What's Changed".
      - name: Compose release notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          node .github/workflows/scripts/update-changelog.mjs --release "v$V" --notes CHANGES.md
          echo "## DriveBenderUtility v$V" > RELEASE_NOTES.md
          echo >> RELEASE_NOTES.md
          cat CHANGES.md >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: dist/*.zip
          body_path: RELEASE_NOTES.md
